name: Fork Gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["validation/**"]

permissions:
  contents: read

concurrency:
  group: fork-gates-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux_startup:
    name: Linux Startup Ports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LDS_DATA_DIR: ${{ runner.temp }}/lds-startup-data
      LDS_CONFIG: ${{ runner.temp }}/lds-startup-config.json
      LDS_ENV: ${{ runner.temp }}/lds-startup.env
      LDS_PLUGINS_DIR: ${{ runner.temp }}/lds-startup-plugins
      LDS_EXTENSIONS_DIR: ${{ runner.temp }}/lds-startup-extensions
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Check Linux Bind Rules
        run: .venv/bin/python -m pytest backend/tests/test_port_utils.py -q --junitxml=linux-startup-ports.xml
      - name: Save Linux Receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-startup-${{ github.event.pull_request.head.sha || github.sha }}
          path: linux-startup-ports.xml
          if-no-files-found: error

  gates:
    name: Full Fork Gates
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create Test Environment
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
          .venv/Scripts/python.exe -m pip install --disable-pip-version-check --no-cache-dir -r backend/requirements-torch-tests.txt

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Browser for Bank Checks
        run: node frontend/node_modules/playwright-core/cli.js install chromium

      - name: Check Bank Imports and Settings in Browser
        id: browser_checks
        if: ${{ !cancelled() }}
        run: node frontend/scripts/bankOtherTagsProbe.mjs

      - name: Save Browser Receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-other-tags-${{ github.event.pull_request.head.sha || github.sha }}
          path: .git/lds-gates-validation/other-tags.json
          include-hidden-files: true
          if-no-files-found: warn

      - name: Check Curation Controls in Browser
        if: ${{ !cancelled() }}
        run: node frontend/scripts/bankCurationProbe.mjs

      - name: Save Curation Receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: curation-${{ github.event.pull_request.head.sha || github.sha }}
          path: .git/lds-gates-validation/curation*
          include-hidden-files: true
          if-no-files-found: error

      - name: Check Identity Learning in Browser
        if: ${{ !cancelled() }}
        run: node frontend/scripts/identityLearningProbe.mjs

      - name: Save Identity Receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identities-${{ github.event.pull_request.head.sha || github.sha }}
          path: .git/lds-gates-validation/identities.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Check Base Model Studio in Browser
        if: ${{ !cancelled() }}
        run: node frontend/scripts/studioBaseProbe.mjs

      - name: Save Studio Receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-base-${{ github.event.pull_request.head.sha || github.sha }}
          path: .git/lds-gates-validation/studio-base.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Run Fork Gates
        # Preserve the browser failure while collecting the independent full gate.
        if: ${{ !cancelled() && (steps.browser_checks.outcome == 'success' || steps.browser_checks.outcome == 'failure') }}
        shell: pwsh
        env:
          LDS_DATA_DIR: ${{ runner.temp }}/lds-gates-data
          LDS_CONFIG: ${{ runner.temp }}/lds-gates-config.json
          LDS_ENV: ${{ runner.temp }}/lds-gates.env
          LDS_PLUGINS_DIR: ${{ runner.temp }}/lds-gates-plugins
          LDS_EXTENSIONS_DIR: ${{ runner.temp }}/lds-gates-extensions
        run: ./scripts/gates.ps1 -Phase Gates -ScratchRoot D:/lds-gates

      - name: Save Gate Receipts
        # The browser check writes a second receipt on the same exact head.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-gates-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .git/lds-gates-validation/*.json
            .git/lds-gates-validation/*-backend.xml
          include-hidden-files: true
          if-no-files-found: warn
