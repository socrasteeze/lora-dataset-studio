name: Fork Gates

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fork-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Full Fork Gates
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create Test Environment
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
          .venv/Scripts/python.exe -m pip install --disable-pip-version-check --no-cache-dir -r backend/requirements-torch-tests.txt

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Fork Gates
        shell: pwsh
        env:
          LDS_DATA_DIR: ${{ runner.temp }}/lds-gates-data
          LDS_CONFIG: ${{ runner.temp }}/lds-gates-config.json
          LDS_ENV: ${{ runner.temp }}/lds-gates.env
          LDS_PLUGINS_DIR: ${{ runner.temp }}/lds-gates-plugins
          LDS_EXTENSIONS_DIR: ${{ runner.temp }}/lds-gates-extensions
        run: ./scripts/gates.ps1 -Phase Gates -ScratchRoot D:/lds-gates

      - name: Save Gate Receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-gates-${{ github.event.pull_request.head.sha || github.sha }}
          path: .git/lds-gates-validation/*.json
          include-hidden-files: true
          if-no-files-found: warn
