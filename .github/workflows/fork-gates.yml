name: Fork Gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["validation/**"]

permissions:
  contents: read

concurrency:
  group: fork-gates-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  gates:
    name: Full Fork Gates
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create Test Environment
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
          .venv/Scripts/python.exe -m pip install --disable-pip-version-check --no-cache-dir -r backend/requirements-torch-tests.txt

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Browser for Bank Checks
        run: node frontend/node_modules/playwright-core/cli.js install chromium

      - name: Check Bank Imports and Settings in Browser
        id: browser_checks
        if: ${{ !cancelled() }}
        run: node frontend/scripts/bankOtherTagsProbe.mjs

      - name: Check Curation Selection Behavior
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          LDS_DATA_DIR: ${{ runner.temp }}/lds-curation-data
          LDS_CONFIG: ${{ runner.temp }}/lds-curation-config.json
          LDS_ENV: ${{ runner.temp }}/lds-curation.env
          LDS_PLUGINS_DIR: ${{ runner.temp }}/lds-curation-plugins
          LDS_EXTENSIONS_DIR: ${{ runner.temp }}/lds-curation-extensions
          LDS_PROFILES_HOME: ${{ runner.temp }}/lds-curation-profiles
        run: |
          .venv/Scripts/python.exe -m pytest backend/tests/test_bank_curation_policy.py backend/tests/test_image_bank_curation.py backend/tests/test_curation_selection_cost.py backend/tests/test_no_personal_data.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location frontend
          try {
            node --import ./scripts/registerSdk.mjs --test src/components/bank/curationPolicy.test.js src/components/bank/curation-ui.test.js src/components/bank/bankBalance.test.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }

      - name: Check Curation Controls in Browser
        if: ${{ !cancelled() }}
        run: node frontend/scripts/bankCurationProbe.mjs

      - name: Run Fork Gates
        # Preserve the browser failure while collecting the independent full gate.
        if: ${{ !cancelled() && (steps.browser_checks.outcome == 'success' || steps.browser_checks.outcome == 'failure') }}
        shell: pwsh
        env:
          LDS_DATA_DIR: ${{ runner.temp }}/lds-gates-data
          LDS_CONFIG: ${{ runner.temp }}/lds-gates-config.json
          LDS_ENV: ${{ runner.temp }}/lds-gates.env
          LDS_PLUGINS_DIR: ${{ runner.temp }}/lds-gates-plugins
          LDS_EXTENSIONS_DIR: ${{ runner.temp }}/lds-gates-extensions
        run: ./scripts/gates.ps1 -Phase Gates -ScratchRoot D:/lds-gates

      - name: Save Gate Receipts
        # The browser check writes a second receipt on the same exact head.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-gates-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .git/lds-gates-validation/*.json
            .git/lds-gates-validation/*-backend.xml
          include-hidden-files: true
          if-no-files-found: warn

      - name: Save Browser Receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-other-tags-${{ github.event.pull_request.head.sha || github.sha }}
          path: .git/lds-gates-validation/other-tags.json
          include-hidden-files: true
          if-no-files-found: warn
