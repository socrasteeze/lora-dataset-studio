name: Fork Gates

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fork-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Full Fork Gates
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create Test Environment
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
          .venv/Scripts/python.exe -m pip install --disable-pip-version-check --no-cache-dir -r backend/requirements-torch-tests.txt

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Check Heartbeat, Missing Rows and Peer HTTP
        shell: pwsh
        env:
          LDS_DATA_DIR: ${{ runner.temp }}/lds-heartbeat-data
          LDS_CONFIG: ${{ runner.temp }}/lds-heartbeat-config.json
          LDS_ENV: ${{ runner.temp }}/lds-heartbeat.env
          LDS_PLUGINS_DIR: ${{ runner.temp }}/lds-heartbeat-plugins
          LDS_EXTENSIONS_DIR: ${{ runner.temp }}/lds-heartbeat-extensions
        run: |
          git diff --exit-code origin/main -- backend/app/gpu_window.py backend/app/job_queue.py
          if ($LASTEXITCODE -ne 0) { throw 'GPU runtime differs from the main baseline.' }
          $heartbeatBaselinePath = 'backend/tests/_gpu_heartbeat_baseline.py'
          try {
            .venv/Scripts/python.exe -c "from pathlib import Path; import subprocess; Path('$heartbeatBaselinePath').write_bytes(subprocess.check_output(['git', 'show', 'origin/main:backend/tests/test_gpu_window_close_race.py']))"
            if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the unchanged baseline.' }
            .venv/Scripts/python.exe -X utf8 -m pytest "${heartbeatBaselinePath}::test_a_long_pass_still_keeps_its_flag_alive" -q --basetemp "$env:RUNNER_TEMP/hb-main"
            $heartbeatBaselineExit = $LASTEXITCODE
            Write-Host "Unchanged main heartbeat replay exit: $heartbeatBaselineExit"
            if ($heartbeatBaselineExit -notin 0, 1) { throw 'The baseline replay could not execute.' }
          } finally {
            Remove-Item -LiteralPath $heartbeatBaselinePath -ErrorAction SilentlyContinue
          }
          .venv/Scripts/python.exe -X utf8 -m pytest backend/tests/test_gpu_window_close_race.py backend/tests/test_bank_forget_missing.py backend/tests/test_peer_training_over_http.py -q --basetemp "$env:RUNNER_TEMP/hb-current"

      - name: Install Browser for Bank Checks
        run: node frontend/node_modules/playwright-core/cli.js install chromium

      - name: Check Bank Imports and Settings in Browser
        run: node frontend/scripts/bankOtherTagsProbe.mjs

      - name: Check Bank Tags and Grouping Contracts
        shell: pwsh
        env:
          LDS_DATA_DIR: ${{ runner.temp }}/lds-focused-data
          LDS_CONFIG: ${{ runner.temp }}/lds-focused-config.json
          LDS_ENV: ${{ runner.temp }}/lds-focused.env
          LDS_PLUGINS_DIR: ${{ runner.temp }}/lds-focused-plugins
          LDS_EXTENSIONS_DIR: ${{ runner.temp }}/lds-focused-extensions
        run: >-
          .venv/Scripts/python.exe -X utf8 -m pytest
          backend/tests/test_bank_tags.py backend/tests/test_bank_folder_person.py
          backend/tests/test_bank_groups.py backend/tests/test_bank_collections.py
          backend/tests/test_bank_dup_distinct.py backend/tests/test_image_bank_semantic_dedup.py
          backend/tests/test_bank_payload_poll_cost.py backend/tests/test_bank_split_exclude.py
          backend/tests/test_bank_folder_exclusion.py backend/tests/test_image_bank_refresh.py
          backend/tests/test_bank_forget_missing.py
          backend/tests/test_gpu_window_close_race.py
          backend/tests/test_klein_path.py -q --basetemp "$env:RUNNER_TEMP/lds-focused-tags"

      - name: Run Fork Gates
        shell: pwsh
        env:
          LDS_DATA_DIR: ${{ runner.temp }}/lds-gates-data
          LDS_CONFIG: ${{ runner.temp }}/lds-gates-config.json
          LDS_ENV: ${{ runner.temp }}/lds-gates.env
          LDS_PLUGINS_DIR: ${{ runner.temp }}/lds-gates-plugins
          LDS_EXTENSIONS_DIR: ${{ runner.temp }}/lds-gates-extensions
        run: ./scripts/gates.ps1 -Phase Gates -ScratchRoot D:/lds-gates

      - name: Save Gate Receipts
        # The browser check writes a second receipt on the same exact head.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-gates-${{ github.event.pull_request.head.sha || github.sha }}
          path: .git/lds-gates-validation/*.json
          include-hidden-files: true
          if-no-files-found: warn

      - name: Save Browser Receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-other-tags-${{ github.event.pull_request.head.sha || github.sha }}
          path: .git/lds-gates-validation/other-tags.json
          include-hidden-files: true
          if-no-files-found: warn
