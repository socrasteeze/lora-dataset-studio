<!doctype html>
<!-- App is dark-only: data-theme is hard-coded on <html> (no inline script,
     so there's no CSP 'script-src' violation, and zero FOUC before first paint). -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it iOS reports every safe-area inset as 0,
         so no env(safe-area-inset-*) padding in the app can keep controls
         clear of the home indicator and the rounded screen corners. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AC%3C/text%3E%3C/svg%3E" />
    <!-- PWA install icon: the tab favicon above is an inline SVG (no extra
         request), but iOS/Android home-screen installs need real raster
         icons + a manifest, or they fall back to a generic placeholder glyph
         instead of the app's mark. Generated from the same 🧬 emoji onto the
         brand gradient (tailwind.config.js `gradient-primary`) — see
         frontend/public/icons/. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>LoRA Dataset Studio</title>
    <meta name="description" content="Build, caption, and curate LoRA training datasets — generation, face scoring, masking, and ai-toolkit training in one workspace." />
    <!-- Inline on purpose: this has to paint before the bundled stylesheet loads. -->
    <style>
      html, body { margin: 0; background: #161617; }
      .boot-loading { display: flex; min-height: 100vh; align-items: center; justify-content: center; color: #98968f; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    </style>
    <script type="module" crossorigin src="/assets/index-ye9CHOGb.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-PQ1ZrCZq.css">
  </head>
  <body class="font-sans">
    <!-- Shown until React mounts: main.jsx waits for the plugin list before its
         first render, and without this the page is blank for that whole wait.
         React replaces everything inside #root on mount. -->
    <div id="root"><div class="boot-loading" role="status">Loading LoRA Dataset Studio…</div></div>
  </body>
</html>
